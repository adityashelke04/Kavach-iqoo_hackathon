<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="Check whether a message is a scam. Runs on your phone, works offline."
    />
    <title>Kavach</title>
    <!-- Body text uses the platform face (Roboto on Android) so it paints with
         no network round-trip. Archivo carries only the wordmark and the
         verdict headline, and degrades to that same stack if it never loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
